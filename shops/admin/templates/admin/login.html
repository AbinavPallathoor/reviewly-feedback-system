{% extends "admin/base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="login">
  <form method="post" class="panel">
    <div class="store"><span class="store-mark">{{ shop.name[:1] }}</span><div><b>{{ shop.name }}</b><small>Store admin</small></div></div>
    <h1>Log in</h1>
    {% if error %}<div class="notice error">{{ error }}</div>{% endif %}
    <label>Email<input name="email" type="email" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary wide">Log in</button>
    <p class="hint">Demo: {{ shop.staff[1] }} / password</p>
  </form>
</div>
{% endblock %}
